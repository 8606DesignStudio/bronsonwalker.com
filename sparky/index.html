<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#15161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparky">
<link rel="manifest" href="manifest.json">
<title>Sparky</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --room:#15161a;
    --chrome:#1e2027;
    --edge:#2c2f38;
    --ink:#e8e6e1;
    --dim:#8d8f98;
    --lamp:#ffd9a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{
    background:var(--room);
    color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- top bar ---------- */
  #topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    padding:8px 10px;background:var(--chrome);
    border-bottom:1px solid var(--edge);position:relative;z-index:30;
  }
  #fileSelect{
    flex:1 1 auto;min-width:0;
    background:#14161b;color:var(--ink);border:1px solid var(--edge);
    border-radius:7px;padding:8px 9px;font:inherit;font-size:14px;
  }
  .btn{
    flex:0 0 auto;background:#2a2d36;color:var(--ink);
    border:1px solid var(--edge);border-radius:7px;
    padding:8px 11px;font:inherit;font-size:14px;font-weight:700;
    cursor:pointer;line-height:1;
  }
  .btn:active{background:#343843;}
  .btn.primary{background:#3d6ea8;border-color:#4d82c0;}
  .btn.primary:active{background:#4a80bd;}
  #saveBtn .dot{
    display:none;width:6px;height:6px;border-radius:50%;
    background:var(--lamp);margin-left:6px;vertical-align:1px;
  }
  body.dirty #saveBtn .dot{display:inline-block;}
  .btn.icon{padding:7px 9px;display:flex;align-items:center;}
  .btn.icon svg{display:block;width:17px;height:17px;stroke:currentColor;
    stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  body.isfull #fsOut{display:block;}
  body.isfull #fsIn{display:none;}
  #fsOut{display:none;}

  /* ---------- the projected sheet ---------- */
  #stage{
    flex:1 1 auto;position:relative;min-height:0;
    overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse at 50% 45%, #23252c 0%, #15161a 70%);
  }
  #sheet{
    position:absolute;left:0;top:0;
    transform-origin:0 0;will-change:transform;
    box-shadow:0 0 0 1px rgba(255,255,255,.10),
               0 0 60px 12px rgba(255,214,150,.10),
               0 14px 40px rgba(0,0,0,.55);
    background:#fff;
  }
  #bgImg{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  /* the film itself -- a faint sheen so you can tell there is a layer on top */
  #sheet::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(122deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 26%,
               rgba(255,255,255,0) 74%,rgba(190,220,255,.10) 100%);
    mix-blend-mode:screen;
  }
  #ink{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;cursor:crosshair;z-index:2;
  }
  body.tool-text #ink{cursor:text;}
  body.tool-eraser #ink{cursor:cell;}
  body.panning #ink{cursor:grabbing;}

  /* ---------- inline label editor ----------
     The text you type is not DOM text -- it is drawn straight onto the
     canvas at its final position, in the marker's own colour and size.
     The field above it is invisible and carries only the caret. So there
     is no rendering to reconcile: pressing Done just takes the box away.
     The box sits UNDER the ink layer so it never veils the text. */
  .txtedit{
    position:absolute;z-index:6;display:flex;align-items:flex-start;
    font-family:'Nunito',sans-serif;font-weight:700;line-height:1;
    white-space:nowrap;background:none;border:0;padding:0;
  }
  .txtedit input{
    font:inherit;line-height:1;color:transparent;background:transparent;
    border:0;outline:0;padding:0;margin:0;
  }
  .txtedit button{
    flex:0 0 auto;align-self:center;margin-left:.55em;
    font-family:'Nunito',sans-serif;font-weight:700;
    font-size:.46em;letter-spacing:.1em;
    background:#f5c518;color:#111;border:0;border-radius:.2em;
    padding:.45em .75em;cursor:pointer;line-height:1;
  }
  .txtedit button:active{background:#ffe066;}
  .txtplate{
    position:absolute;z-index:1;pointer-events:none;
    border:.06em solid #f5c518;border-radius:.1em;
    background:rgba(18,19,24,.45);
    box-shadow:0 .18em .5em rgba(0,0,0,.35);
  }
  .txtplate.onlight{background:rgba(255,255,255,.52);}

  /* zoom readout -- only there when you are zoomed, tap it to snap back */
  #zoomPill{
    position:absolute;left:10px;top:10px;z-index:20;display:none;
    background:rgba(20,22,27,.88);border:1px solid var(--edge);
    color:var(--ink);font:inherit;font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:16px;cursor:pointer;
  }
  #zoomPill.show{display:block;}

  /* ---------- marker tray ---------- */
  #tray{
    flex:0 0 auto;background:var(--chrome);
    border-top:1px solid var(--edge);padding:8px 10px 10px;
    display:flex;flex-direction:column;gap:8px;z-index:30;position:relative;
  }
  #colors{display:flex;gap:8px;justify-content:space-between;}
  .swatch{
    flex:1 1 0;height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.22);
    cursor:pointer;padding:0;position:relative;transition:transform .08s;
  }
  .swatch[aria-pressed="true"]{
    transform:translateY(-4px);
    box-shadow:0 0 0 2px var(--lamp),0 4px 10px rgba(0,0,0,.5);
  }
  #tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .tbtn{
    background:#2a2d36;color:var(--ink);border:1px solid var(--edge);
    border-radius:7px;padding:7px 10px;font:inherit;font-size:13px;
    font-weight:700;cursor:pointer;line-height:1;
  }
  .tbtn[aria-pressed="true"]{background:#3d6ea8;border-color:#4d82c0;}
  .tbtn:disabled{opacity:.35;cursor:default;}
  .tbtn .nib{
    display:inline-block;background:currentColor;border-radius:50%;
    vertical-align:middle;margin-right:3px;
  }
  #layersBtn{background:#33384a;border-color:#454b60;}
  #layersBtn[aria-pressed="true"]{background:#3d6ea8;border-color:#4d82c0;}
  .spacer{flex:1 1 auto;}

  /* ---------- popovers ---------- */
  .pop{
    position:absolute;background:var(--chrome);
    border:1px solid var(--edge);border-radius:9px;
    box-shadow:0 12px 32px rgba(0,0,0,.6);padding:6px;display:none;z-index:40;
  }
  .pop.open{display:block;}
  .pop button{
    display:block;width:100%;text-align:left;background:none;border:0;
    color:var(--ink);font:inherit;font-size:14px;padding:9px 10px;
    border-radius:6px;cursor:pointer;
  }
  .pop button:active{background:#343843;}
  .pop hr{border:0;border-top:1px solid var(--edge);margin:5px 4px;}
  .pop .danger{color:#ff8a80;}
  #menuPanel{top:calc(100% + 6px);right:8px;min-width:212px;}
  #newPanel{top:calc(100% + 6px);right:104px;min-width:158px;}

  /* ---------- transparencies (the stack) ---------- */
  #layerPanel{
    bottom:calc(100% + 6px);left:8px;right:8px;max-height:46vh;overflow:auto;
  }
  .lp-head{
    font-size:12px;letter-spacing:.12em;color:var(--dim);
    padding:4px 8px 6px;text-transform:uppercase;
  }
  .lrow{
    display:flex;align-items:center;gap:6px;
    border-radius:6px;padding:2px;margin-bottom:2px;
  }
  .lrow.active{background:#2d3752;box-shadow:inset 0 0 0 1px #4d82c0;}
  .lrow .eye{
    flex:0 0 auto;width:34px;height:32px;border-radius:6px;border:1px solid var(--edge);
    background:#22252e;color:var(--ink);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .lrow .eye svg{
    width:19px;height:19px;display:block;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  }
  .lrow .eye[aria-pressed="false"]{color:#5d616c;background:#191b21;}
  .lrow .eye .lash{display:none;}
  .lrow .eye[aria-pressed="false"] .lash{display:block;}
  .lrow .lname{
    flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;
    color:var(--ink);font:inherit;font-size:14px;font-weight:700;
    padding:8px 6px 8px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;
  }
  /* a hidden transparency should read as hidden at a glance */
  .lrow.off .lname{color:#6c707c;}
  .lrow .lcount{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px;}
  .lrow .ldel{
    flex:0 0 auto;width:30px;height:32px;border-radius:6px;border:0;
    background:none;color:#ff8a80;font-size:17px;cursor:pointer;padding:0;
  }
  #addLayer{
    width:100%;text-align:center;background:#2a2d36;border:1px solid var(--edge);
    border-radius:7px;color:var(--ink);font:inherit;font-size:14px;font-weight:700;
    padding:9px;margin-top:4px;cursor:pointer;
  }

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:rgba(20,22,27,.95);border:1px solid var(--edge);
    color:var(--ink);padding:9px 16px;border-radius:20px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;
    max-width:80vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:420px){
    .swatch{height:30px;}
    .btn{padding:8px 9px;}
  }
  /* Landscape on a phone -- claw back vertical space, one row instead of
     two. Driven by a class rather than a height media query, because the
     on-screen keyboard also shortens the viewport, and a toolbar that
     reflows the moment the keyboard appears is exactly the jump we are
     trying to get rid of. layout() owns this class and holds it still
     while a label is being typed. */
  body.compact #topbar{padding:5px 8px;gap:6px;}
  body.compact #fileSelect,body.compact .btn{padding:6px 9px;font-size:13px;}
  body.compact #tray{padding:5px 8px 6px;gap:5px;flex-direction:row;align-items:center;}
  body.compact #colors{flex:1 1 auto;gap:5px;}
  body.compact .swatch{height:26px;}
  body.compact #tools{flex:0 0 auto;flex-wrap:nowrap;}
  body.compact #tools .spacer{display:none;}
  body.compact .tbtn{padding:6px 7px;font-size:12px;}
  body.compact .tbtn .nib{display:none;}
  body.compact #toast{bottom:60px;}
</style>
</head>
<body class="tool-pen">

<header id="topbar">
  <select id="fileSelect" aria-label="File"></select>
  <button class="btn" id="newBtn">New</button>
  <button class="btn primary" id="saveBtn">Save<span class="dot"></span></button>
  <button class="btn icon" id="fsBtn" aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 24 24" id="fsIn" aria-hidden="true">
      <path d="M4 9V5a1 1 0 0 1 1-1h4"></path>
      <path d="M20 9V5a1 1 0 0 0-1-1h-4"></path>
      <path d="M4 15v4a1 1 0 0 0 1 1h4"></path>
      <path d="M20 15v4a1 1 0 0 1-1 1h-4"></path>
    </svg>
    <svg viewBox="0 0 24 24" id="fsOut" aria-hidden="true">
      <path d="M9 4v4a1 1 0 0 1-1 1H4"></path>
      <path d="M15 4v4a1 1 0 0 0 1 1h4"></path>
      <path d="M9 20v-4a1 1 0 0 0-1-1H4"></path>
      <path d="M15 20v-4a1 1 0 0 1 1-1h4"></path>
    </svg>
  </button>
  <button class="btn" id="menuBtn" aria-label="More">&#8942;</button>

  <div class="pop" id="newPanel">
    <button data-new="file">New file</button>
    <button data-new="layer">New transparency</button>
  </div>

  <div class="pop" id="menuPanel">
    <button data-act="renamefile">Rename this file</button>
    <button data-act="renamelayer">Rename this transparency</button>
    <button data-act="duplicate">Duplicate this file</button>
    <hr>
    <button data-act="export">Save as image (PNG)</button>
    <button data-act="background">Change background image</button>
    <button data-act="dropbg">Back to the blank pad</button>
    <hr>
    <button data-act="clear">Clear this transparency</button>
    <button data-act="delete" class="danger">Delete this file</button>
    <hr>
    <button data-act="factory" class="danger">Start over -- erase everything</button>
  </div>
</header>

<main id="stage">
  <div id="sheet">
    <img id="bgImg" alt="Background">
    <canvas id="ink"></canvas>
  </div>
  <button id="zoomPill" aria-label="Reset zoom">1.0x &#8635;</button>
</main>

<footer id="tray">
  <div id="colors"></div>
  <div id="tools">
    <button class="tbtn" data-w="fine"><span class="nib" style="width:4px;height:4px"></span>Fine</button>
    <button class="tbtn" data-w="med"><span class="nib" style="width:7px;height:7px"></span>Med</button>
    <button class="tbtn" data-w="bold"><span class="nib" style="width:11px;height:11px"></span>Bold</button>
    <span class="spacer"></span>
    <button class="tbtn" id="layersBtn" aria-pressed="false">Layers</button>
    <button class="tbtn" data-tool="text">Text</button>
    <button class="tbtn" data-tool="eraser">Erase</button>
    <button class="tbtn" id="undoBtn">Undo</button>
    <button class="tbtn" id="redoBtn">Redo</button>
  </div>

  <div class="pop" id="layerPanel">
    <div class="lp-head">Transparencies -- top of the stack first</div>
    <div id="layerList"></div>
    <button id="addLayer">+ New transparency</button>
  </div>
</footer>

<div id="toast"></div>
<input type="file" id="bgFile" accept="image/*" style="display:none">

<script>
(function(){
'use strict';

/* ============================================================
   Sparky

   A FILE is one background plus a stack of TRANSPARENCIES over it.
   Marks live on a transparency, never on the background, and every
   coordinate is a fraction of the image (0..1) rather than a pixel --
   so a file drawn on a phone lines up on a desktop.

   Backgrounds are stored once each, keyed by their content, and files
   point at them. Ten days of work over the same print costs one copy
   of the print.
   ============================================================ */

var COLORS = [
  ['black',  '#111111'],
  ['white',  '#ffffff'],
  ['green',  '#00a651'],
  ['red',    '#e02020'],
  ['blue',   '#1a6fd4'],
  ['brown',  '#8b5a2b'],
  ['yellow', '#f5c518'],
  ['purple', '#8b3fd0'],
  ['orange', '#f07818'],
  ['gray',   '#8a8f98']
];

/* tip widths and label sizes, as a fraction of image width */
var WIDTHS = { fine:0.0015, med:0.0030, bold:0.0060 };
var TEXTS  = { fine:0.0130, med:0.0180, bold:0.0260 };

var FILES_KEY  = 'sparky.files.v1';
var BGS_KEY    = 'sparky.bgs.v1';
var PREF_KEY   = 'sparky.prefs.v1';
var OLD_SHEETS = 'sparky.sheets.v1';   /* the pre-files format */
var OLD_BG     = 'sparky.bg.v1';

var stage    = document.getElementById('stage');
var sheetEl  = document.getElementById('sheet');
var bgImg    = document.getElementById('bgImg');
var cv       = document.getElementById('ink');
var ctx      = cv.getContext('2d');
var sel      = document.getElementById('fileSelect');
var toastEl  = document.getElementById('toast');
var zoomPill = document.getElementById('zoomPill');

var S = {
  fileId:null, name:null, bgId:null,
  layers:[], active:0,
  dirty:false,
  tool:'pen', color:'#111111', width:'med',
  bgW:1600, bgH:1000
};

var live = null;     /* stroke in progress */

function newId(p){
  return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

/* ---------------- storage ---------------- */

function readJSON(key, fallback){
  try { var v = JSON.parse(localStorage.getItem(key)); return v || fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){
    toast('Storage is full -- delete a file, or use Save as image');
    return false;
  }
}
function loadFiles(){ return readJSON(FILES_KEY, []); }
function saveFiles(list){ return writeJSON(FILES_KEY, list); }
function loadBgs(){ return readJSON(BGS_KEY, {}); }
function saveBgs(map){ return writeJSON(BGS_KEY, map); }
function loadPrefs(){ return readJSON(PREF_KEY, {}); }
function savePrefs(){ writeJSON(PREF_KEY, { color:S.color, width:S.width }); }

/* drop any background no file points at any more */
function pruneBgs(){
  var used = {};
  loadFiles().forEach(function(f){ if(f.bgId) used[f.bgId] = 1; });
  if(S.bgId) used[S.bgId] = 1;
  var map = loadBgs(), changed = false;
  for(var k in map){
    if(map.hasOwnProperty(k) && !used[k]){ delete map[k]; changed = true; }
  }
  if(changed) saveBgs(map);
}

/* content key, so the same print loaded twice is stored once */
function hashOf(str){
  var h = 5381;
  for(var i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return 'bg_' + h.toString(36) + '_' + str.length.toString(36);
}

/* one-time move from the old flat list of transparencies */
function migrate(){
  var old = readJSON(OLD_SHEETS, null);
  if(!old || !old.length) return;

  var oldBg = null;
  try { oldBg = localStorage.getItem(OLD_BG); } catch(e){}

  var bgId = null;
  if(oldBg){
    bgId = hashOf(oldBg);
    var map = loadBgs(); map[bgId] = oldBg; saveBgs(map);
  }
  var files = loadFiles();
  old.forEach(function(sh){
    files.push({
      id: newId('f'), name: sh.name, bgId: bgId,
      created: sh.created || Date.now(), updated: sh.updated || Date.now(),
      active: 0,
      layers: [{ id:newId('l'), name:'Transparency 1', on:true, items: sh.items || [] }]
    });
  });
  saveFiles(files);
  try { localStorage.removeItem(OLD_SHEETS); localStorage.removeItem(OLD_BG); } catch(e){}
}

/* ---------------- ui bits ---------------- */

var toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2100);
}
function setDirty(v){
  S.dirty = !!v;
  document.body.classList.toggle('dirty', S.dirty);
}

/* ---------------- transparencies ---------------- */

function activeLayer(){ return S.layers[S.active] || null; }

function makeLayer(name){
  return { id:newId('l'), name:name, on:true, items:[], redo:[] };
}

function addLayer(){
  commitText();
  S.layers.push(makeLayer('Transparency ' + (S.layers.length + 1)));
  S.active = S.layers.length - 1;
  setDirty(true);
  refreshLayers(); updateUndo(); render();
  toast('Added ' + activeLayer().name);
}

function refreshLayers(){
  var list = document.getElementById('layerList');
  list.innerHTML = '';
  /* top of the stack reads first, the way you look down at a pile of film */
  for(var i = S.layers.length - 1; i >= 0; i--){
    (function(idx){
      var L = S.layers[idx];
      var row = document.createElement('div');
      row.className = 'lrow' + (idx === S.active ? ' active' : '') + (L.on ? '' : ' off');
      row.setAttribute('data-layer', String(idx));

      var eye = document.createElement('button');
      eye.className = 'eye';
      eye.setAttribute('aria-pressed', L.on ? 'true' : 'false');
      eye.setAttribute('aria-label', L.on ? 'Hide' : 'Show');
      eye.title = L.on ? 'Hide this transparency' : 'Show this transparency';
      eye.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M2 12s3.7-6.4 10-6.4S22 12 22 12s-3.7 6.4-10 6.4S2 12 2 12z"></path>' +
          '<circle cx="12" cy="12" r="2.7"></circle>' +
          '<path class="lash" d="M4 20L20 4"></path>' +
        '</svg>';
      eye.addEventListener('click', function(e){
        e.stopPropagation();
        L.on = !L.on;
        setDirty(true);
        refreshLayers(); render();
      });

      var name = document.createElement('button');
      name.className = 'lname';
      name.textContent = L.name;
      var count = document.createElement('span');
      count.className = 'lcount';
      count.textContent = L.items.length + (L.items.length === 1 ? ' mark' : ' marks');
      name.appendChild(count);
      name.addEventListener('click', function(){
        commitText();
        S.active = idx;
        if(!L.on){ L.on = true; setDirty(true); }
        refreshLayers(); updateUndo(); render();
      });

      var del = document.createElement('button');
      del.className = 'ldel';
      del.innerHTML = '&times;';
      del.title = 'Delete';
      del.addEventListener('click', function(e){
        e.stopPropagation();
        if(S.layers.length === 1){ toast('A file needs at least one transparency'); return; }
        if(L.items.length && !confirm('Delete "' + L.name + '" and its ' +
            L.items.length + ' marks?')) return;
        S.layers.splice(idx, 1);
        if(S.active >= S.layers.length) S.active = S.layers.length - 1;
        setDirty(true);
        refreshLayers(); updateUndo(); render();
      });

      /* name, then the eye, then the delete -- the two buttons together on the right */
      row.appendChild(name); row.appendChild(eye); row.appendChild(del);
      list.appendChild(row);
    })(i);
  }
  var hidden = S.layers.filter(function(l){ return !l.on; }).length;
  document.getElementById('layersBtn').textContent =
    'Layers ' + (S.active + 1) + '/' + S.layers.length + (hidden ? ' -' + hidden : '');
}

/* ---------------- files ---------------- */

function refreshFiles(){
  var list = loadFiles();
  list.sort(function(a,b){ return (b.updated||0) - (a.updated||0); });
  sel.innerHTML = '';

  if(!S.fileId){
    var o = document.createElement('option');
    o.value = '__unsaved__';
    o.textContent = 'Unsaved file';
    sel.appendChild(o);
  }
  list.forEach(function(f){
    var op = document.createElement('option');
    op.value = f.id;
    op.textContent = f.name + '  (' + (f.layers ? f.layers.length : 1) + ')';
    sel.appendChild(op);
  });
  sel.value = S.fileId ? S.fileId : '__unsaved__';
}

function newFile(){
  cancelText();
  S.fileId = null; S.name = null; S.bgId = null;
  S.layers = [makeLayer('Transparency 1')];
  S.active = 0;
  setDirty(false);
  refreshFiles(); refreshLayers(); updateUndo();
  view.s = 1;
  showBackground(null);          /* straight back to the blank pad */
  render();
}

function openFile(id){
  cancelText();
  var f = loadFiles().filter(function(x){ return x.id === id; })[0];
  if(!f){ toast('That file is gone'); newFile(); return; }
  S.fileId = f.id;
  S.name = f.name;
  S.bgId = f.bgId || null;
  S.layers = (f.layers || []).map(function(L){
    return { id:L.id, name:L.name, on:L.on !== false,
             items:JSON.parse(JSON.stringify(L.items || [])), redo:[] };
  });
  if(!S.layers.length) S.layers = [makeLayer('Transparency 1')];
  S.active = Math.min(f.active || 0, S.layers.length - 1);
  setDirty(false);
  refreshFiles(); refreshLayers(); updateUndo();
  view.s = 1;
  showBackground(S.bgId ? (loadBgs()[S.bgId] || null) : null);
  render();
}

function packLayers(){
  return S.layers.map(function(L){
    return { id:L.id, name:L.name, on:L.on, items:L.items };
  });
}

function writeFile(name){
  var list = loadFiles();
  var now = Date.now();
  var existing = S.fileId ? list.filter(function(f){ return f.id === S.fileId; })[0] : null;

  if(existing){
    /* save IN PLACE -- the whole point, no copies */
    existing.name = name || existing.name;
    existing.bgId = S.bgId;
    existing.layers = packLayers();
    existing.active = S.active;
    existing.updated = now;
  } else {
    S.fileId = newId('f');
    list.push({ id:S.fileId, name:name, bgId:S.bgId, layers:packLayers(),
                active:S.active, created:now, updated:now });
  }
  if(!saveFiles(list)){ if(!existing) S.fileId = null; return false; }
  S.name = name || S.name;
  setDirty(false);
  pruneBgs();
  refreshFiles();
  return true;
}

function nameTaken(name){
  return loadFiles().some(function(f){
    return f.name.toLowerCase() === name.toLowerCase() && f.id !== S.fileId;
  });
}

function defaultName(){
  var d = new Date();
  return (d.getMonth()+1) + '.' + d.getDate() + '.' + String(d.getFullYear()).slice(2);
}

function totalMarks(){
  return S.layers.reduce(function(n, L){ return n + L.items.length; }, 0);
}

function doSave(){
  commitText();
  if(!S.fileId && !totalMarks() && !S.bgId){ toast('Nothing to save yet'); return; }

  if(S.fileId){
    if(writeFile(S.name)) toast('Saved -- ' + S.name);
    return;
  }
  var suggested = defaultName();
  var name = prompt('Name this file:', suggested);
  if(name === null) return;
  name = name.trim();
  if(!name) name = suggested;

  if(nameTaken(name)){
    if(!confirm('"' + name + '" already exists.\n\nOK to overwrite it?')) return;
    S.fileId = loadFiles().filter(function(f){
      return f.name.toLowerCase() === name.toLowerCase();
    })[0].id;
  }
  if(writeFile(name)) toast('Saved -- ' + name);
}

function factoryReset(){
  cancelText();
  S.fileId = null; S.name = null; S.bgId = null;
  S.layers = [makeLayer('Transparency 1')];
  S.active = 0;
  setDirty(false);
  setTool('pen');
  setColor('#111111');
  setWidth('med');

  /* clear storage AFTER resetting the markers -- setColor and setWidth
     each write the preferences back, so wiping first left a key behind */
  try {
    localStorage.removeItem(FILES_KEY);
    localStorage.removeItem(BGS_KEY);
    localStorage.removeItem(PREF_KEY);
    localStorage.removeItem(OLD_SHEETS);
    localStorage.removeItem(OLD_BG);
  } catch(e){}

  refreshFiles(); refreshLayers(); updateUndo();
  view.s = 1;
  showBackground(null);
  render();
}

function confirmDiscard(){
  if(!S.dirty) return true;
  return confirm('This file has unsaved marks.\n\nLeave them behind?');
}

/* ---------------- rendering ---------------- */

var raf = null;
function render(){
  if(raf) return;
  raf = requestAnimationFrame(function(){ raf = null; paint(); });
}

function paint(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  drawLayers(ctx, S.layers, cv.width, cv.height);
  if(live) drawStroke(ctx, live, cv.width, cv.height);
  /* the label being typed, drawn exactly where it will stay */
  if(editor && editor.input.value){
    drawText(ctx, { c:editor.c, s:editor.s, x:editor.p[0], y:editor.p[1],
                    v:editor.input.value }, cv.width, cv.height);
  }
}

function drawLayers(c, layers, w, h){
  for(var i=0;i<layers.length;i++){
    if(layers[i].on !== false) drawItems(c, layers[i].items, w, h);
  }
}

function drawItems(c, items, w, h){
  for(var i=0;i<items.length;i++){
    var it = items[i];
    if(it.t === 'text') drawText(c, it, w, h);
    else drawStroke(c, it, w, h);
  }
}

function drawStroke(c, s, w, h){
  var pts = s.pts;
  if(!pts || !pts.length) return;
  var lw = Math.max(1, s.w * w);
  c.save();
  c.strokeStyle = s.c;
  c.fillStyle = s.c;
  c.lineWidth = lw;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  if(pts.length === 1){
    c.beginPath();
    c.arc(pts[0][0]*w, pts[0][1]*h, lw/2, 0, Math.PI*2);
    c.fill();
    c.restore();
    return;
  }
  c.beginPath();
  c.moveTo(pts[0][0]*w, pts[0][1]*h);
  for(var i=1;i<pts.length-1;i++){
    var x1 = pts[i][0]*w,   y1 = pts[i][1]*h;
    var x2 = pts[i+1][0]*w, y2 = pts[i+1][1]*h;
    c.quadraticCurveTo(x1, y1, (x1+x2)/2, (y1+y2)/2);
  }
  var last = pts[pts.length-1];
  c.lineTo(last[0]*w, last[1]*h);
  c.stroke();
  c.restore();
}

/* a soft counter-shade so pale markers stay readable on pale maps */
function shadeFor(hex){
  return (hex === '#ffffff' || hex === '#f5c518')
    ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.45)';
}
/* is this marker light enough that it needs a dark plate behind it? */
function isPale(hex){
  var n = parseInt(hex.slice(1), 16);
  var lum = 0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255);
  return lum > 150;
}

/* Where a browser puts the glyphs inside a line box of height 1em:
   baseline = top + (1em - (ascent + descent))/2 + ascent.
   Drawing the canvas text on that same rule is what keeps a label from
   hopping when the editing box goes away. */
function baselineIn(c, px){
  var m = c.measureText('Hg');
  if(m.fontBoundingBoxAscent === undefined) return null;
  return (px - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2
         + m.fontBoundingBoxAscent;
}

function drawText(c, t, w, h){
  var px = Math.max(9, t.s * w);
  c.save();
  c.fillStyle = t.c;
  c.font = '700 ' + px + 'px Nunito, sans-serif';
  var off = baselineIn(c, px);
  if(off === null){ c.textBaseline = 'top'; off = 0; }
  else c.textBaseline = 'alphabetic';
  c.shadowColor = shadeFor(t.c);
  c.shadowBlur = px * 0.22;
  c.fillText(t.v, t.x*w, t.y*h + off);
  c.restore();
}

/* ---------------- layout and view ----------------
   base = where the sheet sits at rest, fitted to the stage
   view = the zoom on top of that (scale + offset, no rotation)
   Because the zoom is a CSS transform, getBoundingClientRect() already
   reports the zoomed box, so the drawing maths needs no changes.
--------------------------------------------------------------- */

var base = { x:0, y:0, w:0, h:0 };
var view = { s:1, tx:0, ty:0 };
var MAX_ZOOM = 8;
var layoutFrozen = false;

function layout(){
  /* While a label is being typed the on-screen keyboard shrinks the
     viewport. Re-fitting the sheet to that smaller box is what made the
     whole screen jump, so hold everything exactly where it is. */
  if(layoutFrozen) return;

  /* decide the toolbar shape first -- it changes how tall the stage is */
  document.body.classList.toggle('compact', window.innerHeight <= 520);

  var pad = 20;
  var sw = stage.clientWidth, sh = stage.clientHeight;
  if(sw - pad <= 0 || sh - pad <= 0) return;

  var ar = S.bgW / S.bgH;
  var w = sw - pad, h = w / ar;
  if(h > sh - pad){ h = sh - pad; w = h * ar; }

  base.w = Math.round(w);
  base.h = Math.round(h);
  base.x = Math.round((sw - base.w) / 2);
  base.y = Math.round((sh - base.h) / 2);

  sheetEl.style.left   = base.x + 'px';
  sheetEl.style.top    = base.y + 'px';
  sheetEl.style.width  = base.w + 'px';
  sheetEl.style.height = base.h + 'px';

  clampView();
  applyView();
  setCanvasRes();

  if(editor) editor.fit();
}

function applyView(){
  sheetEl.style.transform =
    'translate(' + view.tx + 'px,' + view.ty + 'px) scale(' + view.s + ')';
  var zoomed = view.s > 1.01;
  zoomPill.classList.toggle('show', zoomed);
  if(zoomed) zoomPill.textContent = view.s.toFixed(1) + 'x ↻';
}

function clampView(){
  var sw = stage.clientWidth, sh = stage.clientHeight;
  var scaledW = base.w * view.s, scaledH = base.h * view.s;

  if(scaledW <= sw) view.tx = (sw - scaledW) / 2 - base.x;
  else view.tx = Math.min(-base.x, Math.max(sw - scaledW - base.x, view.tx));

  if(scaledH <= sh) view.ty = (sh - scaledH) / 2 - base.y;
  else view.ty = Math.min(-base.y, Math.max(sh - scaledH - base.y, view.ty));
}

/* Zoom about a fixed point: whatever was under that screen point stays there. */
function zoomTo(newScale, screenX, screenY, anchor){
  var r = stage.getBoundingClientRect();
  var sx = screenX - r.left, sy = screenY - r.top;
  var a = anchor || {
    x: (sx - base.x - view.tx) / view.s,
    y: (sy - base.y - view.ty) / view.s
  };
  view.s  = Math.max(1, Math.min(MAX_ZOOM, newScale));
  view.tx = sx - base.x - view.s * a.x;
  view.ty = sy - base.y - view.s * a.y;
  clampView();
  applyView();
  return a;
}

function resetView(){
  view.s = 1;
  clampView();
  applyView();
  scheduleRes();
}
zoomPill.addEventListener('click', resetView);

/* Zooming in needs more canvas pixels or the ink goes soft.
   Only re-cut the canvas once the gesture settles -- it is expensive. */
function setCanvasRes(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var q = Math.min(Math.max(view.s, 1), 4);
  var w = Math.max(1, Math.round(base.w * dpr * q));
  var h = Math.max(1, Math.round(base.h * dpr * q));

  var MAXPX = 12000000;
  if(w * h > MAXPX){
    var k = Math.sqrt(MAXPX / (w * h));
    w = Math.round(w * k); h = Math.round(h * k);
  }
  if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  paint();
}

var resTimer;
function scheduleRes(){
  clearTimeout(resTimer);
  resTimer = setTimeout(setCanvasRes, 180);
}

/* ---------------- background ---------------- */

function showBackground(src){
  if(!src){ usePlaceholder(); return; }
  var probe = new Image();
  probe.onload = function(){
    S.bgW = probe.naturalWidth  || 1600;
    S.bgH = probe.naturalHeight || 1000;
    bgImg.src = src;
    layout();
  };
  probe.onerror = function(){ usePlaceholder(); };
  probe.src = src;
}

/* the notepad Sparky starts life on */
function usePlaceholder(){
  var c = document.createElement('canvas');
  c.width = 1600; c.height = 1000;
  var x = c.getContext('2d');
  var i;
  x.fillStyle = '#f4f1e8'; x.fillRect(0,0,1600,1000);
  x.strokeStyle = '#d8d2c2'; x.lineWidth = 1;
  for(i=40;i<1600;i+=40){ x.beginPath(); x.moveTo(i+0.5,0); x.lineTo(i+0.5,1000); x.stroke(); }
  for(i=40;i<1000;i+=40){ x.beginPath(); x.moveTo(0,i+0.5); x.lineTo(1600,i+0.5); x.stroke(); }
  x.strokeStyle = '#c9c1ad'; x.lineWidth = 2;
  for(i=200;i<1600;i+=200){ x.beginPath(); x.moveTo(i+0.5,0); x.lineTo(i+0.5,1000); x.stroke(); }
  for(i=200;i<1000;i+=200){ x.beginPath(); x.moveTo(0,i+0.5); x.lineTo(1600,i+0.5); x.stroke(); }

  S.bgW = 1600; S.bgH = 1000;
  bgImg.src = c.toDataURL('image/png');
  layout();
}

function loadBackgroundFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      /* downscale so one print does not eat the whole storage budget */
      var max = 2000;
      var w = img.naturalWidth, h = img.naturalHeight;
      if(w > max || h > max){
        var k = Math.min(max/w, max/h);
        w = Math.round(w*k); h = Math.round(h*k);
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var cc = c.getContext('2d');
      cc.fillStyle = '#ffffff'; cc.fillRect(0,0,w,h);
      cc.drawImage(img, 0, 0, w, h);
      var url = c.toDataURL('image/jpeg', 0.78);

      var id = hashOf(url);
      var map = loadBgs();
      if(!map[id]){ map[id] = url; saveBgs(map); }
      S.bgId = id;
      setDirty(true);
      showBackground(url);
      toast('Background set -- about ' + Math.round(url.length/1400) + ' KB');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------------- drawing ---------------- */

function pos(e){
  /* rect is post-transform, so this stays correct at any zoom */
  var r = cv.getBoundingClientRect();
  return [
    (e.clientX - r.left) / r.width,
    (e.clientY - r.top)  / r.height
  ];
}

var ptrs    = {};
var nPtrs   = 0;
var gesture = null;
var tapPend = null;
var panDrag = null;
var spaceHeld = false;

function ptrList(){
  var out = [];
  for(var k in ptrs){ if(ptrs.hasOwnProperty(k)) out.push(ptrs[k]); }
  return out;
}

stage.addEventListener('pointerdown', function(e){
  if(e.target === zoomPill) return;                      /* the pill takes its own click */
  if(editor && editor.wrap.contains(e.target)) return;   /* typing a label */
  closePops();
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
  ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
  nPtrs++;

  /* second finger down -- this is a pinch, not a mark */
  if(nPtrs === 2){
    live = null; tapPend = null; panDrag = null;
    startGesture();
    render();
    return;
  }
  if(nPtrs > 2) return;

  /* desktop pan: hold space, or use the middle button */
  if(spaceHeld || e.button === 1){
    panDrag = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty };
    document.body.classList.add('panning');
    return;
  }
  if(e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  if(e.target !== cv) return;

  /* tapping elsewhere finishes the label you were typing */
  if(editor) commitText();

  var p = pos(e);
  if(S.tool === 'text' || S.tool === 'eraser'){
    tapPend = { p:p, x:e.clientX, y:e.clientY };
    return;
  }
  live = { c:S.color, w:WIDTHS[S.width], pts:[p] };
  render();
});

stage.addEventListener('pointermove', function(e){
  if(ptrs[e.pointerId]){ ptrs[e.pointerId].x = e.clientX; ptrs[e.pointerId].y = e.clientY; }

  if(gesture){ moveGesture(); return; }

  if(panDrag){
    view.tx = panDrag.tx + (e.clientX - panDrag.x);
    view.ty = panDrag.ty + (e.clientY - panDrag.y);
    clampView(); applyView();
    return;
  }
  if(tapPend){
    var dx0 = e.clientX - tapPend.x, dy0 = e.clientY - tapPend.y;
    if(dx0*dx0 + dy0*dy0 > 100) tapPend = null;   /* dragged, not a tap */
    return;
  }
  if(!live) return;
  var p = pos(e);
  var last = live.pts[live.pts.length-1];
  var dx = p[0]-last[0], dy = p[1]-last[1];
  /* skip micro-jitter so saved files stay small */
  if(dx*dx + dy*dy < 0.0000025) return;
  live.pts.push(p);
  render();
});

function pointerGone(e){
  if(ptrs[e.pointerId]){ delete ptrs[e.pointerId]; nPtrs = Math.max(0, nPtrs-1); }

  if(gesture){
    if(nPtrs < 2){ gesture = null; scheduleRes(); }
    else startGesture();
    return;
  }
  if(panDrag){
    panDrag = null;
    document.body.classList.remove('panning');
    return;
  }
  if(tapPend){
    var t = tapPend; tapPend = null;
    if(S.tool === 'text') openEditor(t.p);
    else if(S.tool === 'eraser') eraseAt(t.p);
    return;
  }
  endStroke();
}
stage.addEventListener('pointerup', pointerGone);
stage.addEventListener('pointercancel', pointerGone);

function endStroke(){
  if(!live) return;
  var L = activeLayer();
  if(live.pts.length && L){
    L.items.push(live);
    L.redo = [];
    setDirty(true);
    updateUndo();
    refreshLayers();
  }
  live = null;
  render();
}

/* ---------------- pinch ---------------- */

function startGesture(){
  var a = ptrList()[0], b = ptrList()[1];
  if(!a || !b){ gesture = null; return; }
  var r = stage.getBoundingClientRect();
  var mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  gesture = {
    d0: Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)),
    s0: view.s,
    a: {
      x: (mx - r.left - base.x - view.tx) / view.s,
      y: (my - r.top  - base.y - view.ty) / view.s
    }
  };
}

function moveGesture(){
  var a = ptrList()[0], b = ptrList()[1];
  if(!a || !b) return;
  var d = Math.max(1, Math.hypot(b.x-a.x, b.y-a.y));
  var mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  /* one call does both jobs: the spread scales, the midpoint pans */
  zoomTo(gesture.s0 * (d / gesture.d0), mx, my, gesture.a);
}

stage.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomTo(view.s * Math.exp(-e.deltaY * 0.0022), e.clientX, e.clientY);
  scheduleRes();
}, { passive:false });

stage.addEventListener('dblclick', function(){ if(view.s > 1.01) resetView(); });

/* ---------------- the label editor ---------------- */

var editor = null;

function openEditor(p){
  commitText();

  var frac   = TEXTS[S.width];
  var fontPx = frac * base.w;
  var pale   = isPale(S.color);

  var plate = document.createElement('div');
  plate.className = 'txtplate' + (pale ? '' : ' onlight');
  plate.style.fontSize = fontPx + 'px';
  plate.style.left = (p[0] * 100) + '%';
  plate.style.top  = (p[1] * 100) + '%';

  var wrap = document.createElement('div');
  wrap.className = 'txtedit';
  wrap.style.fontSize = fontPx + 'px';
  wrap.style.left = (p[0] * 100) + '%';
  wrap.style.top  = (p[1] * 100) + '%';
  wrap.style.caretColor = S.color;

  var inp = document.createElement('input');
  inp.type = 'text';
  inp.spellcheck = false;
  inp.autocomplete = 'off';
  inp.setAttribute('autocapitalize', 'sentences');
  inp.setAttribute('enterkeyhint', 'done');

  var done = document.createElement('button');
  done.type = 'button';
  done.textContent = 'DONE';

  wrap.appendChild(inp);
  wrap.appendChild(done);
  sheetEl.appendChild(plate);
  sheetEl.appendChild(wrap);

  editor = { wrap:wrap, plate:plate, input:inp, p:p, s:frac, c:S.color };
  layoutFrozen = true;              /* the keyboard must not resize the sheet */

  editor.fit = function(){
    var px = editor.s * base.w;
    wrap.style.fontSize = px + 'px';
    plate.style.fontSize = px + 'px';

    ctx.save();
    ctx.font = '700 ' + px + 'px Nunito, sans-serif';
    var tw = ctx.measureText(inp.value).width;
    ctx.restore();
    inp.style.width = Math.max(px * 8, tw + px * 0.2) + 'px';

    /* the label scales with the image, so at 1x on a phone it can be a
       few pixels tall -- the button must not shrink with it */
    done.style.fontSize = Math.max(11, px * 0.46) + 'px';

    var padX = px * 0.40, padY = px * 0.24, bd = px * 0.06;
    plate.style.transform = 'translate(' + (-(padX + bd)) + 'px,' + (-(padY + bd)) + 'px)';
    plate.style.width  = (wrap.offsetWidth  + 2 * (padX + bd)) + 'px';
    plate.style.height = (wrap.offsetHeight + 2 * (padY + bd)) + 'px';
    render();
  };

  inp.addEventListener('input', editor.fit);
  inp.addEventListener('keydown', function(e){
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); commitText(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancelText(); }
  });
  done.addEventListener('click', function(e){ e.preventDefault(); commitText(); });
  wrap.addEventListener('pointerdown', function(e){ e.stopPropagation(); });

  editor.fit();
  try { inp.focus({ preventScroll:true }); } catch(err){ inp.focus(); }
  lockScroll();

  inp.addEventListener('blur', function(){
    if(editor && editor.input === inp) commitText();
  });
}

/* the page never scrolls; if a focused field drags it, put it back */
function lockScroll(){
  if(window.scrollX || window.scrollY) window.scrollTo(0, 0);
  if(document.body.scrollTop) document.body.scrollTop = 0;
}
window.addEventListener('scroll', lockScroll, { passive:true });

function closeEditor(){
  if(!editor) return null;
  var e = editor;
  editor = null;
  e.wrap.remove();
  e.plate.remove();

  /* let the sheet fit itself again once the keyboard has gone. The
     viewport ends up the size it was before, so nothing actually moves. */
  layoutFrozen = false;
  setTimeout(layout, 60);
  setTimeout(layout, 350);
  return e;
}

function commitText(){
  var e = closeEditor();
  if(!e) return;
  var v = e.input.value.trim();
  var L = activeLayer();
  if(!v || !L){ render(); return; }
  L.items.push({ t:'text', c:e.c, s:e.s, x:e.p[0], y:e.p[1], v:v });
  L.redo = [];
  setDirty(true);
  updateUndo();
  refreshLayers();
  render();
}

function cancelText(){
  if(closeEditor()) render();
}

/* ---------------- eraser (works on the active transparency) ---------------- */

function eraseAt(p){
  var L = activeLayer();
  if(!L) return;
  var r = cv.getBoundingClientRect();
  /* generous touch target: 14 px on screen, expressed back in image fractions */
  var tolX = 14 / r.width, tolY = 14 / r.height;

  for(var i = L.items.length - 1; i >= 0; i--){
    if(hit(L.items[i], p, tolX, tolY)){
      L.items.splice(i,1);
      L.redo = [];
      setDirty(true);
      updateUndo();
      refreshLayers();
      render();
      return;
    }
  }
  if(S.layers.length > 1) toast('Nothing on ' + L.name + ' there');
}

function hit(it, p, tolX, tolY){
  var r = cv.getBoundingClientRect();

  if(it.t === 'text'){
    var px = it.s * r.width;
    ctx.save();
    ctx.font = '700 ' + px + 'px Nunito, sans-serif';
    var wFrac = ctx.measureText(it.v).width / r.width;
    ctx.restore();
    /* the anchor is the top-left corner, so the box runs down and right */
    var hFrac = px / r.height;
    return p[0] >= it.x - tolX && p[0] <= it.x + wFrac + tolX &&
           p[1] >= it.y - tolY && p[1] <= it.y + hFrac + tolY;
  }

  var tol = Math.max(tolX, tolY) + it.w;
  var pts = it.pts;
  for(var i=0;i<pts.length;i++){
    if(i){
      if(segDist(p, pts[i-1], pts[i]) <= tol) return true;
    } else if(Math.abs(pts[0][0]-p[0]) <= tol && Math.abs(pts[0][1]-p[1]) <= tol){
      return true;
    }
  }
  return false;
}

function segDist(p, a, b){
  var vx = b[0]-a[0], vy = b[1]-a[1];
  var wx = p[0]-a[0], wy = p[1]-a[1];
  var len = vx*vx + vy*vy;
  var t = len ? Math.max(0, Math.min(1, (wx*vx + wy*vy)/len)) : 0;
  var dx = wx - t*vx, dy = wy - t*vy;
  return Math.sqrt(dx*dx + dy*dy);
}

/* ---------------- undo / redo (per transparency) ---------------- */

function updateUndo(){
  var L = activeLayer();
  document.getElementById('undoBtn').disabled = !L || !L.items.length;
  document.getElementById('redoBtn').disabled = !L || !L.redo || !L.redo.length;
}
document.getElementById('undoBtn').addEventListener('click', function(){
  var L = activeLayer();
  if(!L || !L.items.length) return;
  L.redo = L.redo || [];
  L.redo.push(L.items.pop());
  setDirty(true); updateUndo(); refreshLayers(); render();
});
document.getElementById('redoBtn').addEventListener('click', function(){
  var L = activeLayer();
  if(!L || !L.redo || !L.redo.length) return;
  L.items.push(L.redo.pop());
  setDirty(true); updateUndo(); refreshLayers(); render();
});

/* ---------------- export ---------------- */

function exportPNG(){
  commitText();
  var out = document.createElement('canvas');
  var max = 3000;
  var w = S.bgW, h = S.bgH;
  if(w > max || h > max){
    var k = Math.min(max/w, max/h);
    w = Math.round(w*k); h = Math.round(h*k);
  }
  out.width = w; out.height = h;
  var c = out.getContext('2d');
  c.fillStyle = '#ffffff';
  c.fillRect(0,0,w,h);

  var img = new Image();
  img.onload = function(){
    c.drawImage(img, 0, 0, w, h);
    drawLayers(c, S.layers, w, h);           /* visible transparencies only */
    var name = (S.name || 'sparky ' + defaultName()).replace(/[\\/:*?"<>|]/g,'-');
    out.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast('Image saved');
    }, 'image/png');
  };
  img.onerror = function(){ toast('Could not read the background'); };
  img.src = bgImg.src;
}

/* ---------------- tray ---------------- */

var colorsEl = document.getElementById('colors');
COLORS.forEach(function(pair){
  var b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = pair[1];
  b.title = pair[0];
  b.setAttribute('aria-label', pair[0]);
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('data-color', pair[1]);
  b.addEventListener('click', function(){ setColor(pair[1]); });
  colorsEl.appendChild(b);
});

function setColor(hex){
  S.color = hex;
  /* picking up a marker means you want to draw with it */
  if(S.tool === 'eraser') setTool('pen');
  Array.prototype.forEach.call(colorsEl.children, function(el){
    el.setAttribute('aria-pressed', el.getAttribute('data-color') === hex ? 'true' : 'false');
  });
  if(editor){
    editor.c = hex;
    editor.wrap.style.caretColor = hex;
    editor.plate.classList.toggle('onlight', !isPale(hex));
    render();
  }
  savePrefs();
}

function setTool(t){
  if(t !== 'text') commitText();
  S.tool = t;
  /* classList, not className -- body also carries dirty / isfull / panning */
  document.body.classList.remove('tool-pen','tool-text','tool-eraser');
  document.body.classList.add('tool-' + t);
  Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'), function(el){
    el.setAttribute('aria-pressed', el.getAttribute('data-tool') === t ? 'true' : 'false');
  });
}

function setWidth(w){
  S.width = w;
  Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function(el){
    el.setAttribute('aria-pressed', el.getAttribute('data-w') === w ? 'true' : 'false');
  });
  savePrefs();
}

Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function(el){
  el.addEventListener('click', function(){ setWidth(el.getAttribute('data-w')); });
});
Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'), function(el){
  el.addEventListener('click', function(){
    var t = el.getAttribute('data-tool');
    setTool(S.tool === t ? 'pen' : t);
  });
});

/* ---------------- popovers ---------------- */

var newPanel   = document.getElementById('newPanel');
var menuPanel  = document.getElementById('menuPanel');
var layerPanel = document.getElementById('layerPanel');
var pops = [newPanel, menuPanel, layerPanel];

function closePops(){
  pops.forEach(function(p){ p.classList.remove('open'); });
  document.getElementById('layersBtn').setAttribute('aria-pressed', 'false');
}
function togglePop(el){
  var wasOpen = el.classList.contains('open');
  closePops();
  if(!wasOpen){
    el.classList.add('open');
    if(el === layerPanel) document.getElementById('layersBtn').setAttribute('aria-pressed','true');
  }
}
pops.forEach(function(p){
  p.addEventListener('click', function(e){ e.stopPropagation(); });
  p.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
});
document.addEventListener('click', function(){ closePops(); });

document.getElementById('menuBtn').addEventListener('click', function(e){
  e.stopPropagation(); togglePop(menuPanel);
});
document.getElementById('newBtn').addEventListener('click', function(e){
  e.stopPropagation(); togglePop(newPanel);
});
document.getElementById('layersBtn').addEventListener('click', function(e){
  e.stopPropagation(); togglePop(layerPanel);
});
document.getElementById('addLayer').addEventListener('click', function(){ addLayer(); });

newPanel.addEventListener('click', function(e){
  var what = e.target.getAttribute && e.target.getAttribute('data-new');
  if(!what) return;
  closePops();
  if(what === 'layer'){ addLayer(); return; }
  commitText();
  if(!confirmDiscard()) return;
  newFile();
  toast('New file -- back to the blank pad');
});

/* ---------------- top bar ---------------- */

document.getElementById('saveBtn').addEventListener('click', doSave);

sel.addEventListener('change', function(){
  var v = sel.value;
  if(v === '__unsaved__') return;
  if(!confirmDiscard()){ refreshFiles(); return; }
  openFile(v);
});

menuPanel.addEventListener('click', function(e){
  var act = e.target.getAttribute && e.target.getAttribute('data-act');
  if(!act) return;
  closePops();

  if(act === 'renamefile'){
    if(!S.fileId){ toast('Save it first, then you can rename it'); return; }
    var n = prompt('Rename this file:', S.name);
    if(n === null) return;
    n = n.trim(); if(!n) return;
    if(nameTaken(n)){ toast('That name is already used'); return; }
    if(writeFile(n)) toast('Renamed');
  }

  else if(act === 'renamelayer'){
    var L = activeLayer();
    if(!L) return;
    var ln = prompt('Rename this transparency:', L.name);
    if(ln === null) return;
    ln = ln.trim(); if(!ln) return;
    L.name = ln;
    setDirty(true);
    refreshLayers();
    toast('Renamed');
  }

  else if(act === 'duplicate'){
    var dn = prompt('Name the copy:', (S.name || defaultName()) + ' copy');
    if(dn === null) return;
    dn = dn.trim(); if(!dn) return;
    S.fileId = null;                    /* detach first, then write afresh */
    if(nameTaken(dn)){ toast('That name is already used'); refreshFiles(); return; }
    S.layers.forEach(function(L){ L.id = newId('l'); });
    if(writeFile(dn)) toast('Copied to "' + dn + '"');
  }

  else if(act === 'export') exportPNG();

  else if(act === 'background') document.getElementById('bgFile').click();

  else if(act === 'dropbg'){
    if(!S.bgId){ toast('Already on the blank pad'); return; }
    S.bgId = null;
    setDirty(true);
    view.s = 1;
    showBackground(null);
    pruneBgs();
    toast('Back to the blank pad');
  }

  else if(act === 'clear'){
    var CL = activeLayer();
    if(!CL || !CL.items.length) return;
    if(!confirm('Wipe every mark on "' + CL.name + '"?\n\n' +
                'The background and the other transparencies stay.')) return;
    CL.redo = CL.items.slice().reverse();
    CL.items = [];
    setDirty(true); updateUndo(); refreshLayers(); render();
    toast('Wiped ' + CL.name);
  }

  else if(act === 'delete'){
    if(!S.fileId){ toast('This file was never saved'); return; }
    if(!confirm('Delete the file "' + S.name + '" and all ' + S.layers.length +
                ' of its transparencies?')) return;
    saveFiles(loadFiles().filter(function(f){ return f.id !== S.fileId; }));
    S.fileId = null;
    pruneBgs();
    toast('Deleted');
    newFile();
  }

  else if(act === 'factory'){
    var n = loadFiles().length;
    if(!confirm(
        'Start over?\n\n' +
        'This erases ' + n + ' saved file' + (n === 1 ? '' : 's') + ', ' +
        'every background, and your marker settings.\n\n' +
        'It cannot be undone.')) return;
    factoryReset();
    toast('Back to fresh');
  }
});

document.getElementById('bgFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if(f) loadBackgroundFile(f);
  e.target.value = '';
});

/* ---------------- full screen ---------------- */

function fsNow(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function toggleFullscreen(){
  if(fsNow()){
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
    return;
  }
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!go){
    /* iPhone Safari has no full screen -- the home screen icon is the way */
    toast('No full screen here: Share > Add to Home Screen');
    return;
  }
  var r = go.call(el);
  if(r && r.catch) r.catch(function(){ toast('Full screen was refused'); });
}

document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

function onFsChange(){
  document.body.classList.toggle('isfull', !!fsNow());
  setTimeout(layout, 60);
  setTimeout(layout, 300);
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

/* ---------------- keyboard (desktop) ---------------- */

document.addEventListener('keyup', function(e){
  if(e.code === 'Space'){
    spaceHeld = false;
    document.body.classList.remove('panning');
  }
});

document.addEventListener('keydown', function(e){
  var tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  var mod = e.ctrlKey || e.metaKey;
  var k = (e.key || '').toLowerCase();

  if(e.code === 'Space'){ spaceHeld = true; e.preventDefault(); return; }
  if(!mod && k === 'f'){ toggleFullscreen(); return; }
  if(!mod && (k === '0' || k === 'escape')){ if(view.s > 1.01){ resetView(); return; } }
  if(!mod && (k === '=' || k === '+')){
    zoomTo(view.s * 1.25, innerWidth/2, innerHeight/2); scheduleRes(); return;
  }
  if(!mod && k === '-'){
    zoomTo(view.s / 1.25, innerWidth/2, innerHeight/2); scheduleRes(); return;
  }
  if(!mod && k === 'l'){ togglePop(layerPanel); return; }

  if(mod && k === 'z'){
    e.preventDefault();
    document.getElementById(e.shiftKey ? 'redoBtn' : 'undoBtn').click();
  } else if(mod && k === 's'){
    e.preventDefault(); doSave();
  } else if(!mod && k === 'e'){
    setTool(S.tool === 'eraser' ? 'pen' : 'eraser');
  } else if(!mod && k === 't'){
    setTool(S.tool === 'text' ? 'pen' : 'text');
  }
});

window.addEventListener('beforeunload', function(e){
  if(S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 250); });

/* ---------------- boot ---------------- */

migrate();

var prefs = loadPrefs();
setTool('pen');
setColor(prefs.color || '#111111');
setWidth(prefs.width || 'med');

S.layers = [makeLayer('Transparency 1')];
S.active = 0;
refreshFiles();
refreshLayers();
updateUndo();
showBackground(null);
layout();

})();
</script>
</body>
