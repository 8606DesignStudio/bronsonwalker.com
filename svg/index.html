<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doris — Vector</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 7.6vh;
        }
        .cockpit-bg {
            position: relative;
            width: min(100vw, calc((100vh - 40px) * 16 / 9));
            max-width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            margin: 18px auto;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
            display: none;
        }
        .cockpit-bg.active { display: block; }
        .scene-svg { display: block; width: 100%; height: 100%; }
        .turn-around-btn {
            position: absolute;
            bottom: 2%;
            left: 3%;
            z-index: 40;
            border-radius: 6px;
            font-family: "Nunito", system-ui, sans-serif;
            color: #F5B800;
            font-weight: 700;
            padding: 2px 8px;
            background: #000;
            border: 1.5px solid #F5B800;
            font-size: clamp(0.8rem, 1.6vw, 1.1rem);
            cursor: pointer;
        }

        /* ===== landing gate: the click that buys us fullscreen ===== */
        #gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #05070a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #gate.gone { display: none; }
        #gate svg { width: 100%; height: 100%; display: block; }
        #gate .enter-hit { cursor: pointer; }
        #gate .enter-label {
            font-family: "Nunito", system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.34em;
            fill: #F5B800;
        }
        #gate .sub {
            font-family: "Nunito", system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.16em;
            fill: #6f6653;
        }
        /* The ring breathes so the button reads as live. Opacity only --
           animating transform makes Chrome rasterise the blur to the element's
           untransformed box, which shows up as a faint square. */
        @keyframes pulse {
            0%, 100% { opacity: 0.30; }
            50%      { opacity: 0.85; }
        }
        #gate .ring-pulse { animation: pulse 3.4s ease-in-out infinite; }
        @keyframes flicker {
            0%, 96%, 100% { opacity: 1; }
            97%           { opacity: 0.55; }
            98%           { opacity: 0.95; }
        }
        #gate .flick { animation: flicker 6s linear infinite; }
        @media (prefers-reduced-motion: reduce) {
            #gate .ring-pulse, #gate .flick { animation: none; }
        }
        /* in fullscreen the stage fills the screen and loses its margin */
        .cockpit-bg:fullscreen, .cockpit-bg:-webkit-full-screen { margin: 0; }
        body.fs { padding-bottom: 0; }
        body.fs .cockpit-bg { margin: 0; box-shadow: none; }
    </style>
</head>
<body>

<!-- ============================ LANDING GATE ============================ -->
<div id="gate">
<svg viewBox="0 0 1536 864" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gBack" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#16202c"/>
      <stop offset="0.55" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="0.5" stop-color="#F5B800"/>
      <stop offset="1" stop-color="#a06a12"/>
    </linearGradient>
    <filter id="gGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="gSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="gGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="gScuff" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="gDirt" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="5" seed="3" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.075
                0 0 0 0 0.062
                0 0 0 0 0.040
                1.15 0.45 0 0 -0.45"/>
    </filter>
    <radialGradient id="gVign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.88"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="864" fill="url(#gBack)"/>
  <!-- hull plating behind the button -->
  <g stroke="#141c26" stroke-width="2" opacity="0.8">
    <line x1="0" y1="216" x2="1536" y2="216"/>
    <line x1="0" y1="648" x2="1536" y2="648"/>
    <line x1="512" y1="0" x2="512" y2="864"/>
    <line x1="1024" y1="0" x2="1024" y2="864"/>
  </g>
  <rect width="1536" height="864" filter="url(#gDirt)" opacity="0.18"/>
  <g fill="#2a3340" opacity="0.55">
    <circle cx="512" cy="216" r="4"/><circle cx="1024" cy="216" r="4"/>
    <circle cx="512" cy="648" r="4"/><circle cx="1024" cy="648" r="4"/>
  </g>

  <!-- the button: a hatch release, worn from use -->
  <ellipse cx="768" cy="432" rx="290" ry="290" fill="#F5B800" opacity="0.06" filter="url(#gSoft)"/>
  <!-- unfiltered: a blurred stroke here leaves a visible filter-region square -->
  <g class="ring-pulse">
    <circle cx="768" cy="432" r="186" fill="none" stroke="#F5B800" stroke-width="1.5" opacity="0.28"/>
    <circle cx="768" cy="432" r="186" fill="none" stroke="#F5B800" stroke-width="6" opacity="0.07"/>
    <circle cx="768" cy="432" r="186" fill="none" stroke="#F5B800" stroke-width="14" opacity="0.03"/>
  </g>
  <circle cx="768" cy="432" r="158" fill="#0b1017" stroke="#1d2733" stroke-width="10"/>
  <circle cx="768" cy="432" r="158" fill="none" stroke="url(#gRing)" stroke-width="3" opacity="0.85" filter="url(#gScuff)"/>
  <circle cx="768" cy="432" r="140" fill="none" stroke="#F5B800" stroke-width="1.2" opacity="0.30" filter="url(#gScuff)"/>
  <!-- scuffed inner face -->
  <circle cx="768" cy="432" r="150" fill="#0d131b"/>
  <circle cx="768" cy="432" r="150" filter="url(#gDirt)" opacity="0.30"/>
  <!-- wear where thumbs land, low on the face -->
  <ellipse cx="768" cy="512" rx="86" ry="34" fill="#F5B800" opacity="0.05"/>

  <!-- letter-spacing adds a trailing gap, so nudge left of centre to compensate -->
  <g class="flick">
    <text class="enter-label" x="757" y="418" font-size="62" text-anchor="middle">ENTER</text>
    <text class="enter-label" x="757" y="418" font-size="62" text-anchor="middle"
          opacity="0.5" filter="url(#gGlow)">ENTER</text>
  </g>
  <text class="sub" x="761" y="470" font-size="17" text-anchor="middle">FULL SCREEN</text>

  <!-- tick marks around the dial, a few worn away -->
  <g stroke="#F5B800" stroke-width="3" opacity="0.35">
    <line x1="768" y1="252" x2="768" y2="268"/>
    <line x1="948" y1="432" x2="932" y2="432"/>
    <line x1="768" y1="612" x2="768" y2="596"/>
    <line x1="588" y1="432" x2="604" y2="432"/>
  </g>
  <g stroke="#F5B800" stroke-width="2" opacity="0.16">
    <line x1="895" y1="305" x2="884" y2="316"/>
    <line x1="895" y1="559" x2="884" y2="548"/>
    <line x1="641" y1="559" x2="652" y2="548"/>
    <line x1="641" y1="305" x2="652" y2="316"/>
  </g>

  <text class="sub" x="768" y="742" font-size="15" text-anchor="middle" opacity="0.55">DORIS &#183; VECTOR BUILD</text>

  <rect width="1536" height="864" fill="url(#gVign)"/>
  <rect width="1536" height="864" filter="url(#gGrain)" opacity="0.16" style="mix-blend-mode:overlay"/>
  <!-- whole panel is the target, so a stray tap still gets you in -->
  <rect class="enter-hit" width="1536" height="864" fill="transparent"/>
</svg>
</div>

<!-- ============================ FOYER ============================ -->
<div class="cockpit-bg active" data-scene="svg-door">

      <stop offset="0" stop-color="#3b3019"/>
      <stop offset="1" stop-color="#191408"/>
    </linearGradient>
    <linearGradient id="fLamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="0.5" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e07d18"/>
    </linearGradient>
    <radialGradient id="fVign" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.40" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.86"/>
    </radialGradient>
    <filter id="fGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- ===== texture / wear filters ===== -->
    <!-- fine film grain, unifies every flat fill -->
    <filter id="fGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <!-- coarse dark grime blotches; alpha row thresholds the noise into patches -->
    <filter id="fGrime" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="5" seed="3" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.075
                0 0 0 0 0.062
                0 0 0 0 0.040
                1.15 0.45 0 0 -0.45"/>
    </filter>
    <filter id="fGrimeB" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.005" numOctaves="4" seed="21" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 0.085
                0 0 0 0 0.055
                1.0 0.5 0 0 -0.48"/>
    </filter>
    <!-- rust: low y-frequency stretches the noise into vertical drips -->
    <filter id="fRust" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.004" numOctaves="4" seed="9" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.40
                0 0 0 0 0.19
                0 0 0 0 0.06
                1.25 0.35 0 0 -0.62"/>
    </filter>
    <!-- dusty haze for light shafts -->
    <filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <!-- breaks perfect vector edges -->
    <filter id="fRough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- ragged leaf edges -->
    <filter id="fLeaf" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- chipped paint mask for the stencil -->
    <filter id="fChip" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="fShaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff9d2e" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fColdShaft" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#6f9ecb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6f9ecb" stop-opacity="0"/>
    </linearGradient>
    <!-- cool shadow / warm highlight grade -->
    <linearGradient id="fGrade" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2d5878" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#101c26" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5a3608" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="fDoorVign" cx="0.5" cy="0.44" r="0.72">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="fDoorClip">
      <path d="M604,800 L604,320 Q604,219 722,219 L898,219 Q1016,219 1016,320 L1016,800 Z"/>
    </clipPath>
    <clipPath id="fWallLClip">
      <polygon points="0,0 400,60 400,864 0,864"/>
    </clipPath>
    <clipPath id="fWallRClip">
      <polygon points="1130,60 1536,0 1536,864 1130,864"/>
    </clipPath>
    <clipPath id="fFloorClip">
      <rect x="0" y="780" width="1536" height="84"/>

    <clipPath id="fBackClip">

    </clipPath>
    <clipPath id="fStripClip">
      <rect x="427" y="228" width="74" height="484" rx="22"/>
    </clipPath>
  </defs>

  <!-- base -->
  <rect width="1536" height="864" fill="#0a0805"/>

  <!-- ceiling -->
  <rect x="0" y="0" width="1536" height="125" fill="#181207"/>
  <polygon points="400,0 1130,0 1075,115 460,115" fill="#221a0c"/>

    <line x1="390" y1="179" x2="1140" y2="179" stroke="#5a4c2c" stroke-width="1.2" opacity="0.35"/>
    <rect x="390" y="90" width="750" height="710" filter="url(#fGrimeB)" opacity="0.5"/>
  </g>

  <!-- ===== left wall + octagonal window ===== -->
  <polygon points="0,0 400,60 400,864 0,864" fill="#2a2212"/>
  <!-- wall panel seams + grime -->
  <g clip-path="url(#fWallLClip)">

<script>
// #cockpit in the URL opens straight into the cockpit
if (location.hash === '#cockpit') {
    document.querySelectorAll('.cockpit-bg').forEach(function (s) {
        s.classList.toggle('active', s.getAttribute('data-scene') === 'svg-cockpit');
    });
}
document.querySelectorAll('.turn-around-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var target = btn.getAttribute('data-go');
        document.querySelectorAll('.cockpit-bg').forEach(function (s) {
            s.classList.toggle('active', s.getAttribute('data-scene') === target);
        });
    });
});

// ===== landing gate =====
// Fullscreen can only be requested from a real user gesture, which is the whole
// reason this page opens on a button instead of dropping you straight in.
(function () {
    var gate = document.getElementById('gate');
    if (!gate) return;

    function goFullscreen() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (!req) return Promise.reject();
        try {
            var p = req.call(el);
            return (p && p.then) ? p : Promise.resolve();
        } catch (e) {
            return Promise.reject(e);
        }
    }

    function enter() {
        gate.classList.add('gone');
        // Landscape lock is best-effort: desktop and iOS both refuse it.
        goFullscreen().then(function () {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function () {});
            }
        }).catch(function () {
            // Fullscreen refused (or unsupported) -- the scene still opens.
        });
    }

    gate.addEventListener('click', enter);
    gate.addEventListener('touchend', function (e) { e.preventDefault(); enter(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
        if (gate.classList.contains('gone')) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
    });

    function syncFsClass() {
        var fs = document.fullscreenElement || document.webkitFullscreenElement;
        document.body.classList.toggle('fs', !!fs);
        // Dropping out of fullscreen puts the browser chrome back, so offer the
        // way back in rather than leaving the scene boxed in by the UI.
        if (!fs) gate.classList.remove('gone');
    }
    document.addEventListener('fullscreenchange', syncFsClass);
    document.addEventListener('webkitfullscreenchange', syncFsClass);
    // bfcache restores (mobile back button) come back without the class
    window.addEventListener('pageshow', syncFsClass);
})();
</script>
