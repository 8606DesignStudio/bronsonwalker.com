<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Reader v0.1</title>
<style>
  :root {
    --bg: #0f0f10;
    --panel: #17171a;
    --text: #d8d4c8;
    --dim: #8a877e;
    --accent: #F5B800;
    --hl: rgba(245, 184, 0, 0.26);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }

  button {
    background: #000;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-family: Consolas, monospace;
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: #1f1a00; }

  #stage {
    height: 100%;
    overflow-y: auto;
    position: relative;
    overflow-anchor: none;
  }
  #page {
    max-width: 68ch;
    margin: 0 auto;
    padding: 48px 24px 45vh 24px;
    font-size: 1.25rem;
    line-height: 1.75;
    position: relative;
  }
  #page p { margin-bottom: 1.1em; }
  #page p.chp { color: var(--accent); margin-top: 2.2em; font-variant: small-caps; letter-spacing: 0.04em; }
  #page p.chp span.read { color: var(--accent); opacity: 0.55; }
  #page span.w { border-radius: 3px; padding: 0.4em 0.14em; margin: 0 -0.14em; }
  #page span.read { color: var(--dim); }

  #toc { margin-bottom: 3em; }
  #toc h1 {
    color: var(--accent);
    font-size: 1.6rem;
    font-weight: normal;
    margin-bottom: 0.2em;
  }
  #toc .author { color: var(--dim); margin-bottom: 1.6em; font-style: italic; }
  #toc h2 {
    color: var(--text);
    font-size: 1.05rem;
    font-weight: normal;
    font-variant: small-caps;
    letter-spacing: 0.08em;
    margin-bottom: 0.8em;
    border-bottom: 1px solid #26262b;
    padding-bottom: 0.4em;
  }
  #toc a {
    display: block;
    color: var(--text);
    text-decoration: none;
    padding: 0.18em 0.3em;
    border-radius: 4px;
    font-size: 1.02rem;
  }
  #toc a:hover { background: var(--hl); color: var(--accent); }
  #toc a .num { color: var(--accent); display: inline-block; min-width: 3.2ch; }

  #hl {
    position: absolute;
    background: var(--hl);
    border-radius: 4px;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: left 140ms ease-out, top 140ms ease-out, width 140ms ease-out, height 140ms ease-out;
  }
  #hl.on { opacity: 1; }

  /* floating game-style buttons */
  .fab {
    position: fixed;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(245, 184, 0, 0.55);
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .fab:hover { background: rgba(31, 26, 0, 0.7); }
  #fabPause { right: 18px; bottom: 22px; }
  #fabPlay  { right: 18px; bottom: 22px; }
  #fabMenu  { right: 18px; bottom: 86px; }
  body.playing #fabPause { display: flex; }
  body.browsing #fabPlay { display: flex; }
  body.browsing #fabMenu { display: flex; }

  /* pause menu overlay */
  #menu {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 9, 0.7);
    z-index: 10;
    align-items: center;
    justify-content: center;
  }
  body.menu #menu { display: flex; }
  #menu .card {
    width: min(460px, 92vw);
    max-height: 92vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 26px;
    font-family: Consolas, monospace;
    font-size: 13px;
    color: var(--dim);
  }
  #menu .screen { display: none; flex-direction: column; gap: 16px; }
  #menu .screen.active { display: flex; }
  #menu .mtitle { color: var(--accent); font-size: 15px; font-weight: bold; }
  #menu .mstats { display: flex; gap: 18px; flex-wrap: wrap; }
  #menu .mstats b { color: var(--text); font-weight: normal; }
  #menu .primary {
    font-size: 16px;
    padding: 12px;
    width: 100%;
  }
  #menu label { display: flex; align-items: center; gap: 10px; }
  #menu label .lbl { min-width: 6ch; }
  #menu input[type=range] { flex: 1; accent-color: var(--accent); }
  #menu .val { color: var(--accent); min-width: 8ch; text-align: right; white-space: nowrap; }
  #menu .row { display: flex; gap: 10px; }
  #menu .row button { flex: 1; padding-left: 4px; padding-right: 4px; white-space: nowrap; }
  #menu .hint { font-size: 12px; line-height: 1.5; }
  #menu .back { align-self: flex-start; }
  #menu .scroll-list {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  #menu .scroll-list::-webkit-scrollbar { width: 6px; }
  #menu .scroll-list::-webkit-scrollbar-track { background: transparent; }
  #menu .scroll-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  #menu .scroll-item { text-align: left; width: 100%; }
  #menu .scroll-item.plain {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: bold;
    padding: 6px 4px;
    border-radius: 4px;
  }
  #menu .scroll-item.plain:hover { background: var(--hl); }
  #menu .scroll-item.stub { opacity: 0.35; cursor: default; text-transform: lowercase; }
  #menu .mtitle.underline { text-decoration: underline; }
  #ambWrap { display: flex; flex-direction: column; gap: 16px; }
  #menu .amb-row { display: flex; align-items: center; gap: 10px; }
  #menu .amb-toggle { min-width: 64px; text-transform: lowercase; }
  #menu .amb-toggle.on { background: #1f1a00; }
  #menu input[type=range].amb-vol { flex: 1; accent-color: var(--accent); }
</style>
</head>
<body class="menu">

<div id="stage">
  <div id="page"><div id="hl"></div></div>
</div>

<button class="fab" id="fabPause" title="pause">&#10074;&#10074;</button>
<button class="fab" id="fabPlay" title="read">&#9654;</button>
<button class="fab" id="fabMenu" title="menu">&#9776;</button>

<div id="menu">
  <div class="card">
    <div class="screen active" id="scrSettings">
      <div class="mtitle" id="bookTitle">Speed Reader</div>
      <div class="mstats">
        <span>today <b id="statToday">0</b> words</span>
        <span>book <b id="statPct">0%</b></span>
      </div>
      <label><span class="lbl">zoom</span> <input type="range" id="font" min="70" max="145" step="5"> <span class="val" id="fontVal"></span></label>
      <label><span class="lbl">speed</span> <input type="range" id="wpm" min="150" max="800" step="10"> <span class="val" id="wpmVal"></span></label>
      <label><span class="lbl">chunk</span> <input type="range" id="chunk" min="1" max="5" step="1"> <span class="val" id="chunkVal"></span></label>
      <label><input type="checkbox" id="ratchet"> ratchet &mdash; increase wpm +5 every minute</label>
      <label id="capRow" style="visibility:hidden"><span class="lbl">target</span> <input type="range" id="cap" min="150" max="800" step="10"> <span class="val" id="capVal"></span></label>
      <div class="row">
        <button id="btnToc">contents</button>
        <button id="btnLibrary">library</button>
        <button id="btnAmbiance">ambiance</button>
      </div>
      <button id="btnPlay" class="primary">start</button>
    </div>

    <div class="screen" id="scrLibrary">
      <div class="mtitle underline">library</div>
      <div class="scroll-list" id="libList"></div>
      <button class="back" id="btnLibBack">&laquo; back</button>
    </div>

    <div class="screen" id="scrAmbiance">
      <div class="mtitle">ambiance</div>
      <div id="ambWrap"></div>
      <button class="back" id="btnAmbBack">&laquo; back</button>
    </div>
  </div>
</div>

<script src="library.js"></script>
<script>
(function () {
  "use strict";

  // ---------- state ----------
  var WINDOW_WORDS = 2600;   // words rendered around the point of interest
  var EXTEND_WORDS = 1400;   // words added per scroll extension
  var MAX_WORDS = 7000;      // trim threshold for the rendered window

  var book = null;
  var paraWords = [];        // [[word,...], ...]
  var paraStart = [];        // global word index of each paragraph's first word
  var chapters = [];         // [{t: title, p: paragraph index}]
  var chapterSet = {};       // paragraph index -> true
  var totalWords = 0;
  var pFirst = 0, pLast = -1; // rendered paragraph range (inclusive)
  var cursor = 0;
  var playing = false;
  var timer = null;
  var ratchetMs = 0;

  var S = {
    get wpm()   { return +(localStorage.sr_wpm || 250); },
    set wpm(v)  { localStorage.sr_wpm = v; },
    get chunk() { return +(localStorage.sr_chunk || 2); },
    set chunk(v){ localStorage.sr_chunk = v; },
    get ratchet()  { return localStorage.sr_ratchet === "1"; },
    set ratchet(v) { localStorage.sr_ratchet = v ? "1" : "0"; },
    get cap()  { return +(localStorage.sr_cap || 500); },
    set cap(v) { localStorage.sr_cap = v; },
    get font()  { return +(localStorage.sr_font || 1.25); },
    set font(v) { localStorage.sr_font = v; },
    pos: function (id, v) {
      if (v === undefined) return +(localStorage["sr_pos_" + id] || 0);
      localStorage["sr_pos_" + id] = v;
    },
    get bookId()  { return localStorage.sr_book || "monte-cristo"; },
    set bookId(v) { localStorage.sr_book = v; },
    addToday: function (n) {
      var key = "sr_day_" + new Date().toISOString().slice(0, 10);
      localStorage[key] = (+(localStorage[key] || 0)) + n;
    },
    today: function () {
      return +(localStorage["sr_day_" + new Date().toISOString().slice(0, 10)] || 0);
    }
  };

  var stage = document.getElementById("stage");
  var page = document.getElementById("page");

  // ---------- chrome (game-style states: menu / playing / browsing) ----------
  function setChrome(state) {
    document.body.classList.remove("menu", "playing", "browsing");
    document.body.classList.add(state);
  }

  function showScreen(name) {
    document.getElementById("scrSettings").classList.toggle("active", name === "settings");
    document.getElementById("scrLibrary").classList.toggle("active", name === "library");
    document.getElementById("scrAmbiance").classList.toggle("active", name === "ambiance");
  }

  function openMenu() {
    document.getElementById("btnPlay").textContent = cursor > 0 ? "resume" : "start";
    updateHud();
    showScreen("settings");
    setChrome("menu");
  }

  // ---------- book loading ----------
  function detectChapters(paras) {
    var found = {};
    paras.forEach(function (p, i) {
      if (p.split("Chapter ").length > 3) return; // TOC blob
      var m = p.match(/^Chapter\s+(\d+)\.\s*/);
      if (m && p.length < 120) found[+m[1]] = i;
    });
    return Object.keys(found).sort(function (a, b) { return a - b; })
      .map(function (n) { return { t: paras[found[n]], p: found[n] }; });
  }

  function loadBook(b) {
    book = b;
    paraWords = [];
    paraStart = [];
    totalWords = 0;
    b.paragraphs.forEach(function (p) {
      var words = p.split(" ");
      paraStart.push(totalWords);
      paraWords.push(words);
      totalWords += words.length;
    });
    chapters = b.chapters || detectChapters(b.paragraphs);
    chapterSet = {};
    chapters.forEach(function (c) { chapterSet[c.p] = true; });
    cursor = Math.min(S.pos(b.id), totalWords - 1);
    S.bookId = b.id;
    document.getElementById("bookTitle").textContent = b.title;
    renderWindow(cursor);
    scrollCursorIntoView(false);
    updateHud();
  }

  // ---------- windowed rendering ----------
  function paraOf(wordIdx) {
    var lo = 0, hi = paraStart.length - 1;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (paraStart[mid] <= wordIdx) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function paraHtml(p) {
    var words = paraWords[p];
    var base = paraStart[p];
    var parts = new Array(words.length);
    for (var i = 0; i < words.length; i++) {
      var w = words[i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var cls = (base + i) < cursor ? "w read" : "w";
      parts[i] = '<span class="' + cls + '" data-i="' + (base + i) + '">' + w + "</span>";
    }
    var pcls = chapterSet[p] ? ' class="chp"' : "";
    return '<p data-p="' + p + '"' + pcls + ">" + parts.join(" ") + "</p>";
  }

  function tocHtml() {
    if (!chapters.length) return "";
    var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
    var links = chapters.map(function (c) {
      var m = c.t.match(/^Chapter\s+(\d+)\.\s*(.*)$/);
      var num = m ? m[1] : "";
      var title = m ? m[2] : c.t;
      return '<a href="#" class="toc-link" data-p="' + c.p + '"><span class="num">' + num + '</span> ' + esc(title) + "</a>";
    });
    return '<div id="toc"><h1>' + esc(book.title) + "</h1>" +
      (book.author ? '<div class="author">' + esc(book.author) + "</div>" : "") +
      "<h2>Contents</h2>" + links.join("") + "</div>";
  }

  function rangeHtml(pa, pb) {
    var html = [];
    for (var p = pa; p <= pb; p++) html.push(paraHtml(p));
    return html.join("");
  }

  function renderedWords() {
    if (pLast < pFirst) return 0;
    return paraStart[pLast] + paraWords[pLast].length - paraStart[pFirst];
  }

  function renderWindow(centerWord) {
    var lo = Math.max(0, centerWord - WINDOW_WORDS / 2);
    var hi = Math.min(totalWords - 1, centerWord + WINDOW_WORDS / 2);
    pFirst = paraOf(lo);
    pLast = paraOf(hi);
    page.innerHTML = '<div id="hl"></div>' + (pFirst === 0 ? tocHtml() : "") + rangeHtml(pFirst, pLast);
  }

  function extendDown() {
    if (pLast >= paraWords.length - 1) return;
    var target = paraStart[pLast] + paraWords[pLast].length + EXTEND_WORDS;
    var newLast = Math.min(paraWords.length - 1, paraOf(Math.min(target, totalWords - 1)));
    if (newLast <= pLast) newLast = pLast + 1;
    page.insertAdjacentHTML("beforeend", rangeHtml(pLast + 1, newLast));
    pLast = newLast;
    trimTop();
  }

  function extendUp() {
    if (pFirst <= 0) return;
    var target = paraStart[pFirst] - EXTEND_WORDS;
    var newFirst = Math.max(0, paraOf(Math.max(0, target)));
    if (newFirst >= pFirst) newFirst = pFirst - 1;
    var before = stage.scrollHeight;
    var html = rangeHtml(newFirst, pFirst - 1);
    if (newFirst === 0 && !document.getElementById("toc")) html = tocHtml() + html;
    document.getElementById("hl").insertAdjacentHTML("afterend", html);
    pFirst = newFirst;
    stage.scrollTop += stage.scrollHeight - before;
    trimBottom();
    refreshHl();
  }

  function trimTop() {
    while (renderedWords() > MAX_WORDS && pFirst < pLast) {
      if (pFirst === paraOf(cursor)) break;
      var el = page.querySelector('p[data-p="' + pFirst + '"]');
      if (!el) break;
      var before = stage.scrollHeight;
      el.remove();
      stage.scrollTop -= before - stage.scrollHeight;
      pFirst++;
    }
    refreshHl();
  }

  function trimBottom() {
    while (renderedWords() > MAX_WORDS && pLast > pFirst) {
      if (pLast === paraOf(cursor)) break;
      var el = page.querySelector('p[data-p="' + pLast + '"]');
      if (!el) break;
      el.remove();
      pLast--;
    }
  }

  var scrollPending = false;
  stage.addEventListener("scroll", function () {
    if (scrollPending) return;
    scrollPending = true;
    requestAnimationFrame(function () {
      scrollPending = false;
      if (stage.scrollTop < 600) extendUp();
      if (stage.scrollHeight - stage.scrollTop - stage.clientHeight < 600) extendDown();
    });
  });

  function ensureRendered(wordIdx) {
    var end = paraStart[pLast] + paraWords[pLast].length;
    if (wordIdx < paraStart[pFirst] || wordIdx >= end) {
      renderWindow(wordIdx);
      return;
    }
    if (end - wordIdx < 200) extendDown();
  }

  function spanAt(i) {
    return page.querySelector('span[data-i="' + i + '"]');
  }

  function scrollCursorIntoView(smooth) {
    var sp = spanAt(cursor);
    if (!sp) return;
    var target = sp.offsetTop - stage.clientHeight * 0.35;
    stage.scrollTo({ top: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
  }

  // ---------- pacer ----------
  var CLAUSE_END = /[,;:.!?—]["'”’)\]]*$/;
  var SENT_END = /[.!?]["'”’)\]]*$/;

  function wordAt(i) {
    var p = paraOf(i);
    return paraWords[p][i - paraStart[p]];
  }

  function plannedChunkSize() {
    // look ahead to the clause boundary and divide the clause evenly,
    // so a comma never strands a one-word crumb (8 words -> 3+3+2, not 3+3+2+orphan)
    var maxLook = S.chunk * 3;
    var balanced = function (d) { return Math.ceil(d / Math.ceil(d / S.chunk)); };
    for (var d = 1; d <= maxLook; d++) {
      var idx = cursor + d - 1;
      var w = wordAt(idx);
      if (idx >= totalWords - 1) return balanced(d);           // book end
      if (SENT_END.test(w)) return balanced(d);                // sentence end: always a boundary
      if (CLAUSE_END.test(w) && d >= 2) return balanced(d);    // comma: only after 2+ words (tiny fragments merge)
      if (paraOf(idx + 1) !== paraOf(idx)) return balanced(d); // paragraph end
    }
    return S.chunk; // no boundary in sight -- normal chunk
  }

  function chunkEnd() {
    var first = spanAt(cursor);
    if (!first) return cursor;
    var top = first.offsetTop;
    var size = plannedChunkSize();
    var end = cursor;
    for (var i = 1; i < size; i++) {
      var prev = spanAt(cursor + i - 1);
      if (prev) {
        var pw = prev.textContent;
        if (SENT_END.test(pw)) break;                       // sentence end: hard stop
        if (CLAUSE_END.test(pw) && i >= 2) break;           // comma stops only after 2+ words
      }
      var sp = spanAt(cursor + i);
      if (!sp || sp.offsetTop !== top) break;
      end = cursor + i;
    }
    return end;
  }

  function chunkDelay(start, end) {
    // time by characters (the eye's real workload), not word count
    var chars = 0;
    for (var i = start; i <= end; i++) {
      var sp = spanAt(i);
      chars += (sp ? sp.textContent.length : 5) + 1;
    }
    var msPerChar = 60000 / (S.wpm * 6); // avg word = 5 chars + space
    var delay = chars * msPerChar;
    // breaths at clause and sentence boundaries
    var lastSp = spanAt(end);
    var wordBeat = 60000 / S.wpm;
    if (lastSp) {
      var w = lastSp.textContent;
      if (SENT_END.test(w)) delay += wordBeat * 0.9;
      else if (CLAUSE_END.test(w)) delay += wordBeat * 0.4;
    }
    // paragraph boundary gets a longer breath
    if (end + 1 < totalWords && paraOf(end + 1) !== paraOf(end)) {
      delay += wordBeat * 1.2;
    }
    return delay;
  }

  var lastHl = null;

  function positionHl(start, end) {
    var hl = document.getElementById("hl");
    var a = spanAt(start), b = spanAt(end);
    if (!hl || !a || !b) { if (hl) hl.classList.remove("on"); return null; }
    var top = a.offsetTop - 2;
    hl.style.left = (a.offsetLeft - 4) + "px";
    hl.style.top = top + "px";
    hl.style.width = ((b.offsetLeft + b.offsetWidth) - a.offsetLeft + 8) + "px";
    hl.style.height = (a.offsetHeight + 4) + "px";
    hl.classList.add("on");
    lastHl = { s: start, e: end };
    return top;
  }

  function refreshHl() {
    // window content changed above the highlight -- re-anchor it to its words
    if (!playing && lastHl) positionHl(lastHl.s, lastHl.e);
  }

  function placeHighlight(start, end) {
    var top = positionHl(start, end);
    if (top === null) return;
    var target = top - stage.clientHeight * 0.35;
    if (Math.abs(stage.scrollTop - target) > stage.clientHeight * 0.25) {
      stage.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    }
  }

  function tick() {
    if (!playing) return;
    if (cursor >= totalWords) { pause(true); return; }
    ensureRendered(cursor);
    var end = chunkEnd();
    placeHighlight(cursor, end);
    var n = end - cursor + 1;
    var delay = chunkDelay(cursor, end);
    timer = setTimeout(function () {
      for (var i = cursor; i <= end; i++) {
        var sp = spanAt(i);
        if (sp) sp.classList.add("read");
      }
      cursor = end + 1;
      S.pos(book.id, cursor);
      S.addToday(n);
      if (S.ratchet && S.wpm < S.cap) {
        ratchetMs += delay;
        if (ratchetMs >= 60000) {
          ratchetMs = 0;
          S.wpm = Math.min(S.cap, S.wpm + 5);
          wpmSlider.value = S.wpm;
        }
      }
      updateHud();
      tick();
    }, delay);
  }

  function play() {
    if (playing) return;
    playing = true;
    ratchetMs = 0;
    setChrome("playing");
    tick();
  }

  function pause(showMenu) {
    playing = false;
    clearTimeout(timer);
    if (showMenu) openMenu(); else setChrome("browsing");
  }

  // ---------- hud + controls ----------
  function updateHud() {
    document.getElementById("statToday").textContent = S.today();
    document.getElementById("statPct").textContent =
      totalWords ? (100 * cursor / totalWords).toFixed(1) + "%" : "0%";
    document.getElementById("wpmVal").textContent = S.wpm + " wpm";
    document.getElementById("chunkVal").textContent = S.chunk;
    document.getElementById("capVal").textContent = S.cap + " wpm";
    document.getElementById("fontVal").textContent = Math.round(S.font / 1.25 * 100) + "%";
  }

  document.getElementById("btnPlay").onclick = function () { this.blur(); play(); };
  document.getElementById("fabPause").onclick = function () { this.blur(); pause(false); };
  document.getElementById("fabPlay").onclick = function () { this.blur(); play(); };
  document.getElementById("fabMenu").onclick = function () { this.blur(); openMenu(); };

  function applyFont() {
    page.style.fontSize = S.font + "rem";
  }

  var wpmSlider = document.getElementById("wpm");
  var chunkSlider = document.getElementById("chunk");
  wpmSlider.value = S.wpm;
  chunkSlider.value = S.chunk;
  wpmSlider.oninput = function () { S.wpm = +this.value; updateHud(); };
  chunkSlider.oninput = function () { S.chunk = +this.value; updateHud(); };

  var ratchetBox = document.getElementById("ratchet");
  var capRow = document.getElementById("capRow");
  ratchetBox.checked = S.ratchet;
  capRow.style.visibility = S.ratchet ? "visible" : "hidden";
  ratchetBox.onchange = function () {
    S.ratchet = this.checked;
    ratchetMs = 0;
    capRow.style.visibility = this.checked ? "visible" : "hidden";
  };

  var capSlider = document.getElementById("cap");
  capSlider.value = S.cap;
  capSlider.oninput = function () { S.cap = +this.value; updateHud(); };

  var fontSlider = document.getElementById("font");
  fontSlider.value = Math.round(S.font / 1.25 * 100);
  fontSlider.oninput = function () {
    S.font = Math.round(1.25 * (+this.value) / 100 * 100) / 100;
    applyFont();
    updateHud();
  };

  // ---------- ambiance ----------
  // Add a stock loop or one of your own recordings by adding a row here --
  // no other code changes needed. file is relative to this page.
  // cap = actual gain when the slider is maxed (100), as a fraction of the
  // source file's original volume. Keeps full slider travel mapped to the
  // range that's actually usable at phone/headphone proximity, so steps
  // land with finer detail instead of wasting range up in "too loud"
  // territory. Tune per-sound as the actual clips change. Can exceed 1.0
  // (true amplification via Web Audio gain, past the source's native
  // level) -- a plain <audio> element's .volume cannot go above 1.0.
  var AMBIANCE = [
    { id: "rain", label: "rain", file: "sounds/rain.mp3", cap: 0.6 },
    { id: "cafe", label: "cafe", file: "sounds/cafe.mp3", cap: 0.6 },
    { id: "city", label: "city", file: "sounds/city.mp3", cap: 1.05 }
  ];

  var audioCtx = null;
  function ambCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  (function ambSetup() {
    var wrap = document.getElementById("ambWrap");
    AMBIANCE.forEach(function (a) {
      var audio = new Audio(a.file);
      audio.loop = true;
      audio.preload = "none";
      var gainNode = null;

      var row = document.createElement("div");
      row.className = "amb-row";
      row.innerHTML =
        '<button class="amb-toggle">' + a.label + '</button>' +
        '<input type="range" class="amb-vol" min="0" max="100" step="5">';
      wrap.appendChild(row);

      var btn = row.querySelector(".amb-toggle");
      var slider = row.querySelector(".amb-vol");
      var lastVol = +(localStorage["sr_amb_" + a.id] || 40) || 40;

      function setVol(v) {
        localStorage["sr_amb_" + a.id] = v;
        slider.value = v;
        var ctx = ambCtx(); // always resume -- context gets suspended again between gestures on some browsers
        if (!gainNode) {
          gainNode = ctx.createGain();
          ctx.createMediaElementSource(audio).connect(gainNode).connect(ctx.destination);
        }
        gainNode.gain.value = (v / 100) * a.cap;
        btn.classList.toggle("on", v > 0);
        if (v > 0) {
          lastVol = v;
          audio.play().catch(function () { /* file not present yet, or blocked until user gesture */ });
        } else {
          audio.pause();
        }
      }

      slider.oninput = function () { setVol(+this.value); };
      btn.onclick = function () {
        this.blur();
        setVol((+slider.value) > 0 ? 0 : lastVol);
      };

      setVol(+(localStorage["sr_amb_" + a.id] || 0));
    });
  })();

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      if (playing) pause(false); else play();
    }
    else if (e.code === "Escape" && !playing) { openMenu(); }
    else if (e.code === "ArrowUp") { e.preventDefault(); S.wpm = Math.min(800, S.wpm + 10); wpmSlider.value = S.wpm; updateHud(); }
    else if (e.code === "ArrowDown") { e.preventDefault(); S.wpm = Math.max(150, S.wpm - 10); wpmSlider.value = S.wpm; updateHud(); }
  });

  // clicking the dark backdrop (not the card) closes the menu into browse mode
  document.getElementById("menu").addEventListener("click", function (e) {
    if (e.target === this) setChrome("browsing");
  });

  page.addEventListener("click", function (e) {
    var link = e.target.closest("a.toc-link");
    if (link) {
      e.preventDefault();
      pause(false);
      cursor = paraStart[+link.dataset.p];
      S.pos(book.id, cursor);
      renderWindow(cursor);
      scrollCursorIntoView(false);
      updateHud();
      return;
    }
    var sp = e.target.closest("span.w");
    if (!sp) {
      // tap landed in dead space -- snap to the nearest word within reach
      var pEl = e.target.closest("p[data-p]") || e.target.closest("#page");
      if (!pEl) return;
      var best = null, bd = Infinity;
      var cand = pEl.querySelectorAll("span.w");
      for (var c = 0; c < cand.length; c++) {
        var r = cand[c].getBoundingClientRect();
        var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
        var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
        var dist = dx * dx + dy * dy;
        if (dist < bd) { bd = dist; best = cand[c]; }
      }
      if (!best || bd > 1600) return; // nothing within ~40px
      sp = best;
    }
    pause(false);
    cursor = +sp.dataset.i;
    S.pos(book.id, cursor);
    var spans = page.querySelectorAll("span.w");
    for (var i = 0; i < spans.length; i++) {
      spans[i].classList.toggle("read", +spans[i].dataset.i < cursor);
    }
    placeHighlight(cursor, cursor);
    updateHud();
  });

  // ---------- menu actions ----------
  document.getElementById("btnToc").onclick = function () {
    this.blur();
    setChrome("browsing");
    renderWindow(0);
    stage.scrollTop = 0;
  };

  // ---------- library screen ----------
  var TITLECASE_MINOR = { a: 1, an: 1, and: 1, as: 1, at: 1, but: 1, by: 1, for: 1, in: 1, nor: 1, of: 1, on: 1, or: 1, so: 1, the: 1, to: 1, up: 1, yet: 1 };
  function titleCase(str) {
    var words = str.split(" ");
    return words.map(function (w, i) {
      var lower = w.toLowerCase();
      if (i !== 0 && i !== words.length - 1 && TITLECASE_MINOR[lower]) return lower;
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }).join(" ");
  }

  function renderLibraryList() {
    var wrap = document.getElementById("libList");
    wrap.innerHTML = "";

    LIBRARY.forEach(function (b) {
      var item = document.createElement("button");
      item.className = "scroll-item plain";
      item.textContent = titleCase(b.title);
      item.onclick = function () { this.blur(); loadBook(b); openMenu(); };
      wrap.appendChild(item);
    });

    // stub rows, no text/link behind them -- just for exercising the scroll
    for (var i = 1; i <= 10; i++) {
      var stub = document.createElement("button");
      stub.className = "scroll-item stub";
      stub.textContent = "test " + i;
      stub.disabled = true;
      wrap.appendChild(stub);
    }
  }

  document.getElementById("btnLibrary").onclick = function () {
    this.blur();
    renderLibraryList();
    showScreen("library");
  };
  document.getElementById("btnLibBack").onclick = function () { this.blur(); showScreen("settings"); };

  document.getElementById("btnAmbiance").onclick = function () { this.blur(); showScreen("ambiance"); };
  document.getElementById("btnAmbBack").onclick = function () { this.blur(); showScreen("settings"); };

  // ---------- boot ----------
  page.style.fontSize = S.font + "rem";
  loadBook(LIBRARY[0]);
  openMenu();
})();
</script>
</body>
</html>
